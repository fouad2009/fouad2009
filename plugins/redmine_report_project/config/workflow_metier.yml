# =========================
# Champs communs (anchors)
# =========================
common_fields:
  prestation_fields: &prestation_fields
    odn_service: capacite_acces_odn_prevue
    canalisation: distance_fo_prevue_km
    pose_fo: distance_fo_prevue_km
    corporate_fo: distance_fo_prevue_km
    reservation_fo: distance_fo_prevue_km
    default: nbr

# =========================
# Actions / Trackers
# =========================
actions:

  # ---------
  # APS
  # ---------
  aps:
    class: Aps

    DEFAULT:
      state: planned
      field: nbr

    INITIALISATION:
      state: not_started
      field: nbr

    ZONAGE:
      state: study_in_progress
      field: nbr

    POINTAGE:
      state: study_in_progress
      field: nbr

    NOTE_CALCULE:
      state: study_in_progress
      field: nbr

    BOQ:
      state: study_in_progress
      field: nbr

    EN_SIGNATURE:
      state: study_in_progress
      field: nbr

    APS_APPROUVE_DO:
      state: study_in_progress
      field: nbr

    SOUS_RESERVE_DIRA:
      state: study_in_progress
      field: nbr

    RESERVE_DIRA_LEVEE:
      state: study_in_progress
      field: nbr

    APS_APPROUVE_DIRA:
      state: study_completed
      field: nbr

    BESOIN_EXPRIME:
      state: study_completed
      field: nbr

  # ---------
  # APD
  # ---------
  apd:
    class: Apd

    DEFAULT:
      state: planned
      field: capacite_acces_odn_prevue

    INITIALISATION:
      state: not_started
      field: capacite_acces_odn_prevue

    SITE_SURVEY:
      state: study_in_progress
      field: capacite_acces_odn_prevue

    PLAN_SCHEMA:
      state: study_in_progress
      field: capacite_acces_odn_prevue

    DEVIS:
      state: study_in_progress
      field: capacite_acces_odn_prevue

    APD_SIGNE_VALIDE:
      state: study_completed
      field: capacite_acces_odn_prevue

  # --------------
  # PRESTATION
  # --------------
  prestation:
    class: Prestation

    DEFAULT:
      state: planned
      field_map: *prestation_fields

    INITIALISATION:
      state: not_started
      field_map: *prestation_fields

    PHASE_ETUDE:
      cases:
        - when:
            ratio:
              lt: 100
          state: study_in_progress
          field_map: *prestation_fields

        - when:
            ratio:
              eq: 100
          state: study_completed
          field_map: *prestation_fields

    PHASE_CONSULTATION:
      state: not_started
      field_map: *prestation_fields
